openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clinic
    description: Public clinic content
  - name: booking
    description: Appointment booking and patient access
  - name: operations
    description: Staff and admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /clinic/overview:
    get:
      operationId: getClinicOverview
      tags: [clinic]
      summary: Get public clinic overview
      responses:
        "200":
          description: Clinic overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicOverview"
  /clinic/doctors:
    get:
      operationId: getDoctors
      tags: [clinic]
      summary: List visiting doctors
      responses:
        "200":
          description: Doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
  /clinic/departments:
    get:
      operationId: getDepartments
      tags: [clinic]
      summary: List clinic departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
  /clinic/services:
    get:
      operationId: getServices
      tags: [clinic]
      summary: List clinic services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClinicService"
  /clinic/faqs:
    get:
      operationId: getFaqs
      tags: [clinic]
      summary: List frequently asked questions
      responses:
        "200":
          description: FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"
  /clinic/gallery:
    get:
      operationId: getGallery
      tags: [clinic]
      summary: List gallery images
      responses:
        "200":
          description: Gallery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryItem"
  /booking/otp/request:
    post:
      operationId: requestOtp
      tags: [booking]
      summary: Request a mobile OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
  /booking/otp/verify:
    post:
      operationId: verifyOtp
      tags: [booking]
      summary: Verify a mobile OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Verified patient session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSession"
  /booking/appointments:
    get:
      operationId: getAppointments
      tags: [booking]
      summary: List patient appointments
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [booking]
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /booking/appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [booking]
      summary: Reschedule or cancel an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /operations/summary:
    get:
      operationId: getOperationsSummary
      tags: [operations]
      summary: Get admin operations summary
      responses:
        "200":
          description: Operations summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ClinicOverview:
      type: object
      required: [name, tagline, description, address, emergencyPhone, email, highlights, image]
      properties:
        name: { type: string }
        tagline: { type: string }
        description: { type: string }
        address: { type: string }
        emergencyPhone: { type: string }
        email: { type: string }
        highlights:
          type: array
          items: { type: string }
        image: { type: string }
    Doctor:
      type: object
      required: [id, name, specialty, credentials, schedule, bio, image]
      properties:
        id: { type: string }
        name: { type: string }
        specialty: { type: string }
        credentials: { type: string }
        schedule: { type: string }
        bio: { type: string }
        image: { type: string }
    Department:
      type: object
      required: [id, name, summary, icon]
      properties:
        id: { type: string }
        name: { type: string }
        summary: { type: string }
        icon: { type: string }
    ClinicService:
      type: object
      required: [id, name, description, category]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
    Faq:
      type: object
      required: [id, question, answer]
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
    GalleryItem:
      type: object
      required: [id, title, caption, image]
      properties:
        id: { type: string }
        title: { type: string }
        caption: { type: string }
        image: { type: string }
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, minLength: 8 }
    OtpChallenge:
      type: object
      required: [challengeId, maskedPhone, expiresInSeconds]
      properties:
        challengeId: { type: string }
        maskedPhone: { type: string }
        expiresInSeconds: { type: integer }
    OtpVerification:
      type: object
      required: [challengeId, phone, code]
      properties:
        challengeId: { type: string }
        phone: { type: string }
        code: { type: string, minLength: 4, maxLength: 4 }
    PatientSession:
      type: object
      required: [patientId, phone, isNew]
      properties:
        patientId: { type: string }
        phone: { type: string }
        isNew: { type: boolean }
    Appointment:
      type: object
      required: [id, patientId, patientName, phone, doctorId, doctorName, department, date, time, status, reason]
      properties:
        id: { type: string }
        patientId: { type: string }
        patientName: { type: string }
        phone: { type: string }
        doctorId: { type: string }
        doctorName: { type: string }
        department: { type: string }
        date: { type: string }
        time: { type: string }
        status: { type: string }
        reason: { type: string }
    AppointmentInput:
      type: object
      required: [patientId, patientName, phone, doctorId, doctorName, department, date, time, reason]
      properties:
        patientId: { type: string }
        patientName: { type: string }
        phone: { type: string }
        doctorId: { type: string }
        doctorName: { type: string }
        department: { type: string }
        date: { type: string }
        time: { type: string }
        reason: { type: string }
    AppointmentUpdate:
      type: object
      properties:
        date: { type: string }
        time: { type: string }
        status: { type: string }
    OperationsSummary:
      type: object
      required: [todayAppointments, pendingRequests, activeDoctors, completedThisMonth, recentAppointments]
      properties:
        todayAppointments: { type: integer }
        pendingRequests: { type: integer }
        activeDoctors: { type: integer }
        completedThisMonth: { type: integer }
        recentAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"

